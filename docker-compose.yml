version: '3.8'

services:
  ethol-backend:
    image: ghcr.io/puppeteer/puppeteer:22
    container_name: ethol-backend
    restart: always
    init: true
    shm_size: '1gb'
    user: "root"
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - HOST=0.0.0.0
      - NO_BROWSER=true
      - DOCKER=true
      - TZ=Asia/Jakarta
      - PUPPETEER_SKIP_CHROMIUM_DOWNLOAD=true
      - PUPPETEER_EXECUTABLE_PATH=/usr/bin/google-chrome-stable
      - NODE_PATH=/node_modules:/home/pptruser/node_modules
    volumes:
      - /DATA/AppData/ethol-backend:/app
      - /DATA/AppData/nginx/config/www/ethol-notifier/screenshots:/app/screenshots
    working_dir: /app
    command: ["node", "serve.js", "--no-open"]
